# Cloudflare Workers static-assets config. The site is a fully static export
# (`next build` -> out/), served by Cloudflare with no Worker code or backend.
# `name` must match the Worker name in the Cloudflare dashboard.
name = "rovqix"
compatibility_date = "2026-10-01"

[assets]
directory = "./out"
# /about -> about.html, /blog/x -> blog/x.html
html_handling = "auto-trailing-slash"
# Unknown URLs get out/404.html with a 404 status.
not_found_handling = "404-page"
